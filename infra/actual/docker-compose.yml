# Actual Budget + Caddy (TLS termination for Cloudflare "Full (strict)").
#
# Runs on the Hetzner VPS. Actual is NOT published to the host — only Caddy is.
# Caddy reverse-proxies to Actual over the internal compose network, which is
# also the path the finance worker will use later (see install-actual.md §8).
#
# Data lives on the Hetzner volume mounted at /mnt/data (see install doc §4).

services:
  actual-server:
    image: actualbudget/actual-server:latest
    restart: unless-stopped
    # Note: deliberately no `ports:` — not reachable from outside the network.
    expose:
      - "5006"
    volumes:
      - /mnt/data/actual:/data
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3

  # AI-facing MCP budget server (agigante80/actual-mcp-server). See ADR-0002 and
  # docs/mcp-budget-server.md. Like actual-server, it is NOT published to the host
  # (no `ports:`) — Caddy reverse-proxies to it. It reaches Actual over THIS internal
  # compose network at http://actual-server:5006, bypassing Cloudflare Access (a
  # non-browser client Access would otherwise block). Its own Bearer/OIDC token is
  # the gate. Secrets come from mcp.env (gitignored; copy from mcp.env.example).
  actual-mcp:
    # Pinned to :develop (ADR-0002 supply-chain note; ADR-0004). The project's GHCR
    # registry publishes latest/develop and SHA-pinned digests (latest-<sha>,
    # development-<sha>); stable semver tags use 0.x.x format and top out at 0.4.2,
    # which predates OIDC support. OIDC is confirmed only on the develop track.
    # Revisit when a stable release that includes OIDC is published; pin to the
    # 0.x.x semver tag or a latest-<sha> digest at that point.
    image: ghcr.io/agigante80/actual-mcp-server:develop
    restart: unless-stopped
    depends_on:
      - actual-server
    expose:
      - "3600"
    env_file:
      - ./mcp.env
    environment:
      # Talk to Actual over the internal network, not the public URL.
      ACTUAL_SERVER_URL: "http://actual-server:5006"
      # HTTP transport bound inside the container; Caddy terminates public TLS.
      MCP_BRIDGE_PORT: "3600"
      MCP_BRIDGE_BIND_HOST: "0.0.0.0"
      # The @actual-app/api library keeps a full local synced budget copy here.
      MCP_BRIDGE_DATA_DIR: "/app/data"
    volumes:
      # Persist the synced budget copy on the Hetzner data volume.
      - /mnt/data/actual-mcp:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - actual-server
      - actual-mcp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
