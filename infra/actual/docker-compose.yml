# Actual Budget + Caddy (TLS termination for Cloudflare "Full (strict)").
#
# Runs on the Hetzner VPS. Actual is NOT published to the host — only Caddy is.
# Caddy reverse-proxies to Actual over the internal compose network, which is
# also the path the finance worker will use later (see install-actual.md §8).
#
# Data lives on the Hetzner volume mounted at /mnt/data (see install doc §4).

services:
  actual-server:
    image: actualbudget/actual-server:latest
    restart: unless-stopped
    # Note: deliberately no `ports:` — not reachable from outside the network.
    expose:
      - "5006"
    volumes:
      - /mnt/data/actual:/data
    healthcheck:
      test: [ "CMD-SHELL", "node src/scripts/health-check.js" ]
      interval: 60s
      timeout: 10s
      retries: 3

  # AI-facing MCP budget server (agigante80/actual-mcp-server). See ADR-0002 and
  # docs/mcp-budget-server.md. Like actual-server, it is NOT published to the host
  # (no `ports:`) — Caddy reverse-proxies to it. It reaches Actual over THIS internal
  # compose network at http://actual-server:5006, bypassing Cloudflare Access (a
  # non-browser client Access would otherwise block). Its own Bearer/OIDC token is
  # the gate. Secrets come from mcp.env (gitignored; copy from mcp.env.example).
  actual-mcp:
    # Pinned to a reviewed semver tag (ADR-0002 supply-chain note; ADR-0005).
    # 0.22.31 is the deployed version (SaaS-OIDC cutover was verified on 0.22.11, see
    # docs/mcp-budget-server.md §7g). 0.22.x requires OIDC_RESOURCE to be an absolute
    # URL and treats OIDC_SCOPES as a comma-separated, ENFORCED list. Bump deliberately
    # after reading release notes and re-running the smoke + OIDC acceptance tests.
    image: ghcr.io/agigante80/actual-mcp-server:0.22.31
    restart: unless-stopped
    depends_on:
      - actual-server
    expose:
      - "3600"
    env_file:
      - ./mcp.env
    environment:
      # Talk to Actual over the internal network, not the public URL.
      ACTUAL_SERVER_URL: "http://actual-server:5006"
      # HTTP transport bound inside the container; Caddy terminates public TLS.
      MCP_BRIDGE_PORT: "3600"
      MCP_BRIDGE_BIND_HOST: "0.0.0.0"
      # The @actual-app/api library keeps a full local synced budget copy here.
      MCP_BRIDGE_DATA_DIR: "/app/data"
    volumes:
      # Persist the synced budget copy on the Hetzner data volume.
      - /mnt/data/actual-mcp:/app/data

  college-app:
    image: college-app:latest
    build:
      context: ../college
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/data.db
    volumes:
      - /mnt/data/college:/app/data

  # Actual HTTP REST API sidecar (jhonderson/actual-http-api). Exposes the full
  # @actual-app/api surface as REST+Swagger so the Hub backend (and any other REST
  # client) can query budget data without embedding the Node library in-process.
  # See docs/install-actual-http-api.md. Pin the version tag — it should match
  # actual-server's release (26.x.x tracks Actual Budget 26.x.x).
  actual-http-api:
    image: jhonderson/actual-http-api:26.6.1
    restart: unless-stopped
    depends_on:
      - actual-server
    expose:
      - "5007"
    env_file:
      - ./actual-http-api.env
    environment:
      # Talk to Actual over the internal network, not the public URL.
      ACTUAL_SERVER_URL: "http://actual-server:5006"
      PORT: "5007"
      # Disable endpoints that rely on Actual internals — safer for a public endpoint.
      EXPERIMENTAL_OPERATIONS_ENABLED: "false"
    volumes:
      # Own data dir, isolated from the MCP server's synced copy to avoid concurrent
      # access to the same @actual-app/api dataDir from two processes.
      - /mnt/data/actual-http-api:/app/data

  # Budget KPIs for the hub landing page's Money card. A stdlib-only Python loop that
  # reads (GET only) from actual-http-api over the internal network every 15 min and
  # writes budget-kpis.json into the landing_data volume, which Caddy serves at
  # https://<apex>/data/budget-kpis.json (behind the apex's Cloudflare Access app).
  # The API key stays server-side. See docs/runbook-landing-updates.md §4 and ADR-0007.
  budget-kpis:
    image: python:3.13-alpine
    restart: unless-stopped
    depends_on:
      - actual-http-api
    command: [ "python", "/app/budget_kpis.py" ]
    env_file:
      # Optional so a not-yet-created file doesn't break every other compose command;
      # unconfigured, the service idles and the card shows "Budget figures unavailable".
      - path: ./budget-kpis.env
        required: false
    environment:
      ACTUAL_API_URL: "http://actual-http-api:5007/v1"
      KPI_OUT_PATH: "/out/budget-kpis.json"
      KPI_INTERVAL_SECONDS: "900"
    volumes:
      - ../landing/budget-kpis:/app:ro
      - landing_data:/out

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - actual-server
      - actual-mcp
      - college-app
      - actual-http-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      # Static hub landing page, served by Caddy's file_server (no app container).
      - ../landing/public:/srv/landing:ro
      # Generated landing data (budget-kpis.json), written by the budget-kpis service.
      - landing_data:/srv/data:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  landing_data:
  caddy_data:
  caddy_config:
