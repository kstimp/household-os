#cloud-config
# First-boot provisioning for the Household OS VPS.
# Installs Docker Engine + the compose plugin. The data volume is mounted
# by hand in the install doc (step 4) so device paths stay explicit.
package_update: true
package_upgrade: true

apt:
  sources:
    docker.list:
      source: "deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - unattended-upgrades

# Enable automatic security patches and schedule reboots after the backup window.
write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/50unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:30";

runcmd:
  - systemctl enable --now docker
  - mkdir -p /opt/household-os
  # Tailscale for the admin plane (docs/install-tailscale.md). Installs the package and
  # daemon only — it does NOT authenticate (no auth key = no secret in user_data). Run
  # `tailscale up` by hand after first boot to join the tailnet. noble = 24.04.
  - curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg -o /usr/share/keyrings/tailscale-archive-keyring.gpg
  - curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-list -o /etc/apt/sources.list.d/tailscale.list
  - apt-get update
  - apt-get install -y tailscale
  - systemctl enable --now tailscaled
